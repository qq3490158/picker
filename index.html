ng:12px 14px;border:1px solid rgba(120,120,128,.16);border-radius:14px;font-size:14px;outline:0;min-width:0;background:rgba(255,255,255,.8);transition:box-shadow .2s,border-color .2s}.input-row input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(62,155,255,.18);background:#fff}.status{font-size:12px;color:var(--gray);margin-top:10px;text-align:center}.error-banner{background:rgba(255,107,97,.92);color:#fff;padding:14px 16px;border-radius:18px;margin-bottom:14px;font-size:14px;line-height:1.6;display:none;box-shadow:0 6px 18px rgba(255,107,97,.3)}.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:rgba(30,30,34,.78);color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9999;max-width:90vw;text-align:center;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}.toast.show{opacity:1}.active-loc{background:var(--ink);border-radius:14px;padding:12px 14px;font-size:13px;color:#333}.active-loc .label{font-size:11px;color:var(--gray);margin-bottom:4px}.active-loc .value{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:13px}.fav-list{max-height:240px;overflow-y:auto}.fav-item{display:flex;align-items:center;gap:8px;padding:11px 12px;background:var(--ink);border-radius:14px;margin-bottom:7px;cursor:pointer;transition:background .15s}.fav-item:active{background:rgba(120,120,128,.22)}.fav-item .fav-info{flex:1;min-width:0}.fav-item .fav-name{font-size:14px;font-weight:600;color:#333;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fav-item .fav-coords{font-size:11px;color:var(--gray);font-family:ui-monospace,"SF Mono",monospace;margin-top:2px}.fav-item .fav-active{font-size:10px;color:var(--green);font-weight:600}.fav-item .fav-del{flex:none;width:28px;height:28px;border:none;border-radius:50%;background:0 0;color:var(--red);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}.fav-item .fav-del:hover{background:rgba(255,107,97,.12)}.fav-empty{text-align:center;color:var(--gray);font-size:13px;padding:16px 0}.fav-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.fav-header h3{margin-bottom:0}.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(20,20,30,.4);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:10000;display:none;align-items:center;justify-content:center;padding:20px}.modal-overlay.show{display:flex}.modal{background:rgba(255,255,255,.82);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border:1px solid rgba(255,255,255,.6);border-radius:24px;padding:22px;width:100%;max-width:340px;box-shadow:0 24px 60px rgba(30,40,80,.25)}.modal h3{font-size:17px;font-weight:700;margin-bottom:16px;text-align:center;letter-spacing:-.3px}.modal input{width:100%;padding:12px;border:1px solid rgba(120,120,128,.16);border-radius:12px;font-size:15px;outline:0;margin-bottom:12px;background:rgba(255,255,255,.8)}.modal input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(62,155,255,.18);background:#fff}.modal .modal-btns{display:flex;gap:8px}.modal .modal-btns .btn{padding:12px}.modal .confirm-msg{font-size:15px;line-height:1.6;color:#333;text-align:center;margin-bottom:18px}.bottom-bar{position:relative;margin:4px 0 12px;display:flex;align-items:center;justify-content:space-around;padding:8px 10px;border-radius:26px;background:rgba(255,255,255,.38);backdrop-filter:blur(32px) saturate(190%);-webkit-backdrop-filter:blur(32px) saturate(190%);border:1px solid rgba(255,255,255,.75);box-shadow:0 14px 40px rgba(60,90,180,.18),inset 0 1px 0 rgba(255,255,255,.95)}.bottom-btn{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:62px;border:none;background:0 0;color:var(--text);font-size:11px;font-weight:600;cursor:pointer;padding:4px 0;border-radius:18px;transition:transform .1s}.bottom-btn:active{transform:scale(.92)}.bottom-btn .ic{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:.15s}.bottom-btn.loc .ic{background:rgba(62,155,255,.16);color:var(--blue)}.bottom-btn.loc .ic svg{width:19px;height:19px}.bottom-btn.clear .ic{background:rgba(255,107,97,.16);color:var(--red)}.bottom-btn.clear .ic svg{width:19px;height:19px}@media(max-width:480px){.app-header{margin:10px 12px 0;padding:11px 13px}.map-wrap{padding:12px 12px 0}.panel{padding:12px}#map{height:38vh}}</style>

<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

<header class="app-header">
  <div class="logo"><img src="wechat-avatar.jpg" alt="头像" /></div>
  <div>
    <h1>放弃幻想，好好上班</h1>
    <p>选点 · 打卡 · 清除</p>
  </div>
</header>

<div class="map-wrap">
<div id="map"></div>
<div class="layer-switch">
  <button class="layer-btn active" data-layer="satellite" onclick="switchLayer('satellite')">卫星</button>
  <button class="layer-btn" data-layer="amap" onclick="switchLayer('amap')" title="高德为偏移图源，选点已自动换算">高德</button>
  <button class="layer-btn" data-layer="voyager" onclick="switchLayer('voyager')">彩色</button>
  <button class="layer-btn" data-layer="standard" onclick="switchLayer('standard')">标准</button>
  <button class="layer-btn" data-layer="dark" onclick="switchLayer('dark')">暗色</button>
</div>
</div>

<div class="panel">
  <div class="error-banner" id="errorBanner">无法使用，请关闭浏览器🤪</div>

  <div class="card">
    <h3>选择目标位置</h3>
    <div class="coords" id="coords">当前所在位置</div>
    <div class="row">
      <button class="btn btn-primary" id="saveBtn" onclick="save()">储存到设备</button>
      <button class="btn btn-secondary" onclick="addFav()">收藏位置</button>
      <button class="btn btn-secondary" onclick="locateMe()">当前位置</button>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="btn btn-secondary" onclick="goPlace(1)">总部</button>
      <button class="btn btn-secondary" onclick="goPlace(2)">北区</button>
      <button class="btn btn-secondary" onclick="goPlace(3)">东区</button>
      <button class="btn btn-danger" onclick="clearLocation()">清除</button>
    </div>
  </div>

  <div class="card">
    <h3>搜索经纬度</h3>
    <div class="input-row">
      <input id="lonInput" placeholder="经度" inputmode="decimal" />
      <input id="latInput" placeholder="纬度" inputmode="decimal" />
      <button class="btn btn-primary" style="flex:none;min-width:60px" onclick="locateInput()">定位</button>
    </div>
  </div>

  <div class="card">
    <div class="fav-header">
      <h3>收藏的位置</h3>
      <button class="btn btn-sm btn-secondary" onclick="clearAllFav()" id="clearAllBtn" style="display:none">清空全部</button>
    </div>
    <div id="favList" class="fav-list"></div>
  </div>

  <div class="card">
    <h3>当前生效坐标</h3>
    <div class="active-loc" id="activeLoc">
      <div class="label">设备持久化数据</div>
      <div class="value" id="activeValue">查询中...</div>
    </div>
    <div class="row">
      <button class="btn btn-sm btn-secondary" onclick="queryActive()">刷新</button>
      <button class="btn btn-sm btn-danger" onclick="clearActive()">清除数据</button>
    </div>
  </div>



<div class="status" id="status">「用作学习，不做商用」</div>
</div>

<div class="toast" id="toast"></div>
<div class="modal-overlay" id="favModal">
  <div class="modal">
    <h3>收藏此位置</h3>
    <input id="favNameInput" placeholder="输入备注名称（如: 公司、家）" maxlength="30" />
    <div style="font-size:12px;color:var(--gray);margin-bottom:12px;text-align:center" id="favModalCoords"></div>
    <div class="modal-btns">
      <button class="btn btn-secondary" onclick="closeFavModal()">取消</button>
      <button class="btn btn-primary" onclick="confirmFav()">保存</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="confirmModal">
  <div class="modal">
    <div class="confirm-msg" id="confirmMsg"></div>
    <div class="modal-btns">
      <button class="btn btn-secondary" onclick="closeConfirm()">取消</button>
      <button class="btn btn-danger" onclick="okConfirm()">确定</button>
    </div>
  </div>
</div>
