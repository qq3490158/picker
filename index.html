<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
#shellGate{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;
  justify-content:center;padding:24px}
#shellGate .box{background:#fff;border-radius:22px;padding:34px 28px;max-width:400px;width:100%;
  box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center}
#shellGate .ic{font-size:44px;margin-bottom:14px}
#shellGate h2{font-size:18px;color:#1d1d1f;font-weight:600;margin-bottom:22px}
#shellGate .err{color:#FF3B30;font-size:13px;margin-bottom:14px;min-height:18px}
#shellGate input{width:100%;padding:15px;font-size:20px;text-align:center;letter-spacing:2px;
  border:2px solid #e5e5ea;border-radius:13px;outline:none;background:#fafafa;
  -webkit-appearance:none;font-family:inherit}
#shellGate input:focus{border-color:#3E9BFF;background:#fff}
#shellGate button{width:100%;margin-top:14px;padding:15px;font-size:16px;font-weight:600;color:#fff;
  background:#3E9BFF;border:0;border-radius:13px;cursor:pointer;font-family:inherit}
#shellGate button:active{opacity:.85}
</style>
</head>
<body>
<div id="shellGate"><form class="box" id="shellForm">
  <div class="ic">📍</div>
  <h2>请输入口令</h2>

  <input id="shellInput" type="tel" inputmode="numeric" pattern="[0-9]*" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="请输入">
  <button type="submit">进入</button>
</form></div>

  var gate = document.getElementById('shellGate');
  var form = document.getElementById('shellForm');
  var input = document.getElementById('shellInput');
  var err = document.getElementById('shellErr');

  function b64d(s) {
    var bin = atob(s), a = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    return a;
  }
  function deriveKey(pass) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey'])
      .then(function (km) {
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: b64d(D.s), iterations: D.n, hash: 'SHA-256' },
          km, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);

  function decryptWith(k) {

      .then(function (pt) { return JSON.parse(new TextDecoder().decode(pt)); });
  }
  function inject(p) {
    var st = document.createElement('style');
    st.textContent = p.c;
    document.head.appendChild(st);
    if (gate.parentNode) gate.parentNode.removeChild(gate);   // 外壳退场，换成真页面
    document.body.insertAdjacentHTML('beforeend', p.h);

  function ask() {
    gate.style.display = '';
    input.value = '';
    setTimeout(function () { try { input.focus(); } catch (e) {} }, 120);

    var v = input.value.trim();
